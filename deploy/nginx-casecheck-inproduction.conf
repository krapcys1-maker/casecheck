# Insert only inside the existing inproduction.dev HTTPS server block.
# The portfolio root, location /, certificates and HTTP redirects stay intact.
# CASECHECK_PUBLIC_ORIGIN=https://inproduction.dev
    # BEGIN CaseCheck temporary interview panel
    location = /casecheck {
        return 307 https://inproduction.dev/casecheck/;
    }
    location ^~ /casecheck/ {
        if ($host = www.inproduction.dev) {
            return 307 https://inproduction.dev$request_uri;
        }
        proxy_pass http://127.0.0.1:8861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_next_upstream off;
        client_max_body_size 8m;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # END CaseCheck temporary interview panel

